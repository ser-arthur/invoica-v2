name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @invoica/pdf exec playwright-core install --with-deps chromium
      # The PDF tests read the rendered files with poppler's pdfinfo, pdffonts, pdftotext and pdftoppm.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pnpm format:check
      - run: pnpm copy:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
          BETTER_AUTH_URL: http://localhost:3000
          DATABASE_URL: postgres://invoica_app:invoica_app@localhost:5432/invoica

  image:
    # The container images build from every commit (Dockerfile; docs/deploy.md), and the migration image applies
    # every migration to an empty database set up as the deployment guide sets one up.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target migrate -t invoica-migrate .
      - run: docker build --target runner -t invoica-app .
      - name: The migration image migrates an empty database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 \
            -c "create role invoica_owner login password 'owner' nosuperuser nobypassrls createdb" \
            -c "create role invoica_app login password 'app' nosuperuser nobypassrls nocreatedb nocreaterole" \
            -c "create role invoica_worker login password 'worker' nosuperuser nobypassrls nocreatedb nocreaterole" \
            -c "create database invoica owner invoica_owner"
          docker run --rm --network host \
            -e DATABASE_OWNER_URL=postgres://invoica_owner:owner@localhost:5432/invoica invoica-migrate
          docker run --rm --network host \
            -e DATABASE_OWNER_URL=postgres://invoica_owner:owner@localhost:5432/invoica invoica-migrate

  e2e:
    # End-to-end tests at desktop and phone widths against the development server, on a fresh migrated database.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://invoica_app:invoica_app@localhost:5432/invoica
      DATABASE_OWNER_URL: postgres://invoica_owner:invoica_owner@localhost:5432/invoica
      DATABASE_WORKER_URL: postgres://invoica_worker:invoica_worker@localhost:5432/invoica
      BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      BETTER_AUTH_URL: http://localhost:3000
      FILE_STORAGE_DIR: ${{ github.workspace }}/.data/files
      EMAIL_PROVIDER: file
      MAILBOX_DIR: ${{ github.workspace }}/.data/mail
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @invoica/pdf exec playwright-core install --with-deps chromium
      - run: pnpm --filter @invoica/web exec playwright install --with-deps chromium
      - run: pnpm --filter @invoica/db setup:dev
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Start the development server
        run: |
          pnpm --filter @invoica/web dev > dev-server.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:3000/sign-in > /dev/null && exit 0; sleep 2; done
          cat dev-server.log; exit 1
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            apps/web/test-results
            dev-server.log

  e2e-production:
    # The same end-to-end tests against the production server as the image runs it: the standalone build, its
    # start-up check of the settings, production headers, cookies and rate limits.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://invoica_app:invoica_app@localhost:5432/invoica
      DATABASE_OWNER_URL: postgres://invoica_owner:invoica_owner@localhost:5432/invoica
      DATABASE_WORKER_URL: postgres://invoica_worker:invoica_worker@localhost:5432/invoica
      BETTER_AUTH_SECRET: ci-only-not-a-secret-ci-only-not-a-secret
      BETTER_AUTH_URL: http://localhost:3000
      CRON_SECRET: cionlynotasecretcionlynotasecret
      FILE_STORAGE_DIR: ${{ github.workspace }}/.data/files
      EMAIL_PROVIDER: file
      EMAIL_FROM: Invoica <invoices@invoica.local>
      MAILBOX_DIR: ${{ github.workspace }}/.data/mail
      INVOICA_CLIENT_IP_HEADER: x-forwarded-for
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @invoica/pdf exec playwright-core install --with-deps chromium
      - run: pnpm --filter @invoica/web exec playwright install --with-deps chromium
      - run: pnpm --filter @invoica/db setup:dev
        env:
          DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      - run: pnpm build
      - name: Start the production server
        run: |
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cd apps/web/.next/standalone
          NODE_ENV=production PORT=3000 HOSTNAME=127.0.0.1 node apps/web/server.js > "$GITHUB_WORKSPACE/server.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:3000/api/health > /dev/null && exit 0; sleep 2; done
          cat "$GITHUB_WORKSPACE/server.log"; exit 1
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-production-results
          path: |
            apps/web/test-results
            server.log
